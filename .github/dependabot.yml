version: 2
updates:
  # Renovate owns regular version PRs; zero disables only those PRs here.
  # Dependabot Alerts/Security Updates must remain enabled in GitHub settings.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    ignore:
      # Preserve the InfluxDB 2 / Flux boundary for security updates as well.
      - dependency-name: influxdb
        versions: [">=3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: daily
    open-pull-requests-limit: 0
