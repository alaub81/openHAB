name: Scheduled security

on:
  schedule:
    - cron: '0 3 * * 1' # Scan upstream images weekly, including mutable latest tags.
    - cron: '0 3 1 * *' # Scan the complete secret history monthly as well.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security
  cancel-in-progress: false

jobs:
  secrets:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./tools/secret-check.sh --full
  images:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-images.yml
