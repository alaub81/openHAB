# DWD Warnleiste: Styles am Root; Hilfsfunktionen mit expliziten Abhängigkeiten.
version: 1
widgets:
  dwd_warnleiste:
    tags:
      - "Wetter"
      - "DWD"
      - "Warnungen"
    props:
      parameterGroups:
        -
          name: "warning1"
          label: "Warnung 1"
        -
          name: "warning2"
          label: "Warnung 2"
        -
          name: "warning3"
          label: "Warnung 3"
        -
          name: "warning4"
          label: "Warnung 4"
        -
          name: "warning5"
          label: "Warnung 5"
      parameters:
        -
          name: "title"
          label: "Titel"
          type: "TEXT"
          default: "DWD Wetterwarnungen"
        -
          name: "testMode"
          label: "Testmodus"
          type: "TEXT"
          default: "live"
          description: "Beispieldaten dienen nur zur Vorschau. Für echte DWD-Warnungen unbedingt Live wählen. Es werden keine Items verändert."
          options:
            -
              value: "live"
              label: "Live – verknüpfte Items"
            -
              value: "0"
              label: "Test – keine Warnung"
            -
              value: "1"
              label: "Test – eine Warnung"
            -
              value: "2"
              label: "Test – zwei Warnungen"
            -
              value: "5"
              label: "Test – fünf Warnungen"
        -
          name: "alarm1"
          label: "Alarm / Warnung vorhanden"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "Switch; ON = Meldung vorhanden, OFF = keine Meldung."
        -
          name: "event1"
          label: "Event"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "Warnungsart für Symbol und kompakten Titel."
        -
          name: "severity1"
          label: "Severity"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "Minor, Moderate, Severe oder Extreme."
        -
          name: "from1"
          label: "Valid from"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "DateTime-Item: Beginn des Warnzeitraums."
        -
          name: "to1"
          label: "Valid to"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "DateTime-Item: Ende des Warnzeitraums."
        -
          name: "headline1"
          label: "Headline"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "Offizielle Überschrift im aufgeklappten Bereich."
        -
          name: "description1"
          label: "Description"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "Vollständiger Warntext."
        -
          name: "instruction1"
          label: "Instruction"
          type: "TEXT"
          context: "item"
          groupName: "warning1"
          description: "Verhaltenshinweise; leere Inhalte werden ausgeblendet."
        -
          name: "alarm2"
          label: "Alarm / Warnung vorhanden"
