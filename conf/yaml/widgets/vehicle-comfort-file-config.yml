---
version: 1
widgets:
  bmw_vehicle_comfort_list:
    tags: []
    props:
      parameterGroups:
        - name: vehicle
          label: Fahrzeug
        - name: energy
          label: Energie und Kilometer
        - name: status
          label: Status und Empfangszeit
        - name: openings
          label: Fenster, Türen und Kofferraum
        - name: tires
          label: Reifen
      parameters:
        - name: vehicleName
          label: Fahrzeugname
          type: TEXT
          default: Mein BMW
          groupName: vehicle
        - name: vehicleGroup
          label: Vehicle-Equipment-Gruppe
          type: TEXT
          context: item
          groupName: vehicle
          description: Zur Zuordnung dokumentiert; Messwerte werden ausdrücklich über die folgenden
            Item-Parameter gewählt.
        - name: driveType
          label: Antrieb
          type: TEXT
          default: EV
          groupName: vehicle
          options:
            - label: Elektro
              value: EV
            - label: Diesel
              value: DIESEL
            - label: Benzin
              value: ICE
            - label: Plug-in-Hybrid
              value: PHEV
        - name: batteryItem
          label: Akku (%)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Dimensionless, Wert von 0 bis 100 in Prozent.
        - name: fuelItem
          label: Tank (%)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Dimensionless, Wert von 0 bis 100 in Prozent.
        - name: batteryEnergyItem
          label: Aktueller Akkuinhalt als Item (optional, kWh / Wh)
          type: TEXT
          context: item
          groupName: energy
          description: Nur ein Item für tatsächlich aktuell gespeicherte Energie, nicht die
            Gesamtkapazität. Optionaler direkter Messwert; sonst wird der Inhalt aus nutzbarer
            Kapazität und Ladeprozent berechnet.
        - name: batteryMissingEnergyItem
          label: Fehlende Akkuenergie bis 100 % (kWh)
          type: TEXT
          context: item
          groupName: energy
          description: 'Optional: BMW smeEnergyDeltaFullyCharged; kWh oder Wh, einheitenlos
            als kWh. Vorrang vor Berechnung aus Akkukapazität.'
        - name: batteryCapacityItem
          label: Nutzbare Akkukapazität als Item (kWh / Wh)
          type: TEXT
          context: item
          groupName: energy
          description: Gesamtkapazität des nutzbaren Akkus. Berechnet aktuellen Akkuinhalt und
            fehlende Energie aus Ladeprozent. Vorrang vor fester Kapazität. Das Delta-Item ersetzt
            nur die Berechnung der fehlenden Energie.
        - name: batteryCapacityKwh
          label: Nutzbare Akkukapazität (kWh)
          type: DECIMAL
          min: 0
          groupName: energy
          description: Feste nutzbare Gesamtkapazität für die Berechnung des aktuellen Akkuinhalts
            und der fehlenden Energie aus Ladeprozent; alternativ Kapazitäts-Item verwenden.
            Ohne Ladeverluste.
        - name: fuelRemainingItem
          label: Restkraftstoff (Liter)
          type: TEXT
          context: item
          groupName: energy
          description: 'Optional: BMW remainingFuel; Zustand in l/L, einheitenlos als Liter.
            Zusammen mit Tankkapazität zur Berechnung der fehlenden Liter.'
        - name: tankCapacityLiters
          label: Tankkapazität (Liter)
          type: DECIMAL
          min: 0
          groupName: energy
          description: 'Für fehlende Liter: Tankkapazität minus Restkraftstoff, andernfalls
            Schätzung aus Tank-Prozentstand.'
        - name: rangeItem
          label: Gesamtreichweite (km)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Length, Zustand in km.
        - name: electricRangeItem
          label: Elektrische Reichweite (km)
          type: TEXT
          context: item
          groupName: energy
          description: Optional für Plug-in-Hybrid; Zustand in km.
        - name: mileageItem
          label: Kilometerstand (km)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Length, Zustand in km.
        - name: chargingItem
          label: Ladestatus
          type: TEXT
          context: item
          groupName: status
          description: Switch oder String. Aktive und inaktive Zustände unten konfigurieren.
        - name: chargingCableItem
          label: Ladekabel angeschlossen
          type: TEXT
          context: item
          groupName: status
          description: 'Optional: Anschlussstatus des Ladekabels, unabhängig vom eigentlichen
            Ladestatus.'
        - name: chargingCableConnectedStates
          label: 'Ladekabel: angeschlossen'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Rohzustände als einzelne Einträge. Standard: ON, TRUE, CONNECTED, PLUGGED_IN.'
        - name: chargingCableDisconnectedStates
          label: 'Ladekabel: getrennt'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Rohzustände als einzelne Einträge. Standard: OFF, FALSE, DISCONNECTED,
            UNPLUGGED.'
        - name: chargingPowerItem
          label: Ladeleistung Wallbox (W / kW)
          type: TEXT
          context: item
          groupName: energy
          description: Leistungs-Item des Wallbox-Strommessers. W oder kW werden als Watt angezeigt;
            ohne Einheit wird W angenommen. Keine automatische Ableitung des Fahrzeug-Ladestatus.
        - name: chargingPowerStandbyWatts
          label: Standby-Grenze Wallbox (W)
          type: INTEGER
          default: 10
          min: 0
          groupName: energy
          description: 'Messwerte bis einschließlich dieser Grenze werden als 0 W angezeigt.
            Größere Messwerte bleiben unverändert. Standard: 10 W.'
        - name: chargeTargetItem
          label: Ladeziel (%)
          type: TEXT
          context: item
          groupName: energy
          description: Optional; Zustand in Prozent.
        - name: chargeRemainingItem
          label: Restladezeit (Minuten)
          type: TEXT
          context: item
          groupName: energy
          description: Optional; Number oder Number:Time, Zustand in min.
        - name: lockItem
          label: Verriegelungsstatus
          type: TEXT
          context: item
          groupName: status
          description: Switch oder String. Verriegelt/entriegelt unten konfigurieren.
        - name: windowItems
          label: Fenster (mehrere Items)
          type: TEXT
          context: item
          multiple: true
          groupName: openings
          description: Einzelne Fenster-Items auswählen. Keine Item-Gruppe erforderlich; unbekannte
            Werte bleiben sichtbar.
        - name: doorItems
          label: Türen und Kofferraum (mehrere Items)
          type: TEXT
          context: item
          multiple: true
          groupName: openings
          description: Einzelne Tür- und Kofferraum-Items auswählen. Öffnungszustände verwenden,
            keinen Verriegelungsstatus.
        - name: windowOpenStates
          label: 'Fenster: offen / teilweise offen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für offene Fenster. Ohne eigene Liste: OPEN, OPENED, INTERMEDIATE,
            TILTED, PARTIALLY_OPEN. Mehrere Zustände als einzelne Einträge hinzufügen.'
        - name: windowClosedStates
          label: 'Fenster: geschlossen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für geschlossene Fenster. Ohne eigene Liste: CLOSE, CLOSED.'
        - name: doorOpenStates
          label: 'Türen und Kofferraum: offen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für offene Türen und Kofferraum. Ohne eigene Liste: TRUE,
            ON.'
        - name: doorClosedStates
          label: 'Türen und Kofferraum: geschlossen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für geschlossene Türen und Kofferraum. Ohne eigene Liste:
            FALSE, OFF.'
        - name: openingsItem
          label: Öffnungsstatus (bisheriges Sammel-Item, optional)
          type: TEXT
          context: item
          groupName: openings
          description: 'Fallback, wenn keine Fenster-/Tür-Items ausgewählt sind. ON: offen,
            OFF: zu. Neue Einzel-Items haben Vorrang.'
        - name: tireWarningItem
          label: Reifenwarnung (aggregiert)
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: ON bedeutet Warnung, OFF bedeutet keine gemeldete Warnung.
            Ohne dieses Item wird kein Reifen-OK abgeleitet.'
        - name: tirePressureUnit
          label: Reifendruck-Einheit bei Werten ohne Einheit
          type: TEXT
          default: bar
          groupName: tires
          options:
            - label: bar
              value: bar
            - label: kPa
              value: kPa
            - label: Pa
              value: Pa
            - label: hPa
              value: hPa
            - label: MPa
              value: MPa
            - label: psi
              value: psi
          description: Nur wenn der Item-Rohzustand und items.unit keine Einheit liefern. Bei
            einheitenlosen BMW-Werten in kPa hier kPa auswählen. Number:Pressure bevorzugen.
        - name: tireFLItem
          label: Reifendruck vorne links
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: tireFRItem
          label: Reifendruck vorne rechts
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: tireRLItem
          label: Reifendruck hinten links
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: tireRRItem
          label: Reifendruck hinten rechts
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: lastUpdateItem
          label: Letzter Empfang (DateTime)
          type: TEXT
          context: item
          groupName: status
          description: 'Homie telemetry#last-update: Empfangszeit der Bridge, kein Messzeitpunkt
            jedes einzelnen Werts.'
        - name: lockedState
          label: 'Zustände: verriegelt'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung
            beachten. Ohne eigene Zuordnung: ON.'
        - name: unlockedState
          label: 'Zustände: entriegelt'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung
            beachten. Ohne eigene Zuordnung: OFF.'
        - name: chargingState
          label: 'Zustände: lädt'
          type: TEXT
          multiple: true
          groupName: status
          description: Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung beachten.
        - name: notChargingState
          label: 'Zustände: lädt nicht'
          type: TEXT
          multiple: true
          groupName: status
          description: Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung beachten.
    component: f7-list-item
    config:
      accordionItem: =!!(((props.windowItems || []).length > 0 || (props.doorItems || []).length
        > 0) || !!(props.tireFLItem || props.tireFRItem || props.tireRLItem || props.tireRRItem))
      noChevron: true
      class: bmw-vehicle-comfort
      style:
        --f7-list-item-padding-horizontal: 16px
        --f7-list-item-min-height: 44px
    slots:
      inner:
        - component: oh-context
          config:
            functions:
              state: '=(name) => name && items[name] ? items[name].state : ''UNDEF'''
              number: '=(name) => name && items[name] && items[name].state !== ''NULL'' && items[name].state
                !== ''UNDEF'' && items[name].state !== '''' ? (items[name].numericState !==
                undefined ? items[name].numericState : Number.parseFloat(items[name].state))
                : -1'
              value: '=(name, suffix, digits) => name && items[name] && items[name].state !==
                ''NULL'' && items[name].state !== ''UNDEF'' && Number.isFinite(Number.parseFloat(items[name].state))
                && Number.parseFloat(items[name].state) >= 0 ? Number.parseFloat(items[name].state).toLocaleString(''de-DE'',
                {minimumFractionDigits:digits, maximumFractionDigits:digits}) + suffix : ''—'''
              power: '=(name) => name && items[name] && Number.isFinite(Number.parseFloat(items[name].state))
                && Number.parseFloat(items[name].state) >= 0 && (!items[name].unit || items[name].unit
                === ''W'' || items[name].unit === ''kW'') && (items[name].state.split('' '').length
                === 1 || items[name].state.split('' '')[1] === ''W'' || items[name].state.split(''
                '')[1] === ''kW'') ? Number.parseFloat(items[name].state) * (items[name].unit
                === ''kW'' || items[name].state.split('' '')[1] === ''kW'' ? 1000 : 1) : -1'
              pressure: '=(name) => name && items[name] && Number.isFinite(Number.parseFloat(items[name].state))
                && Number.parseFloat(items[name].state) >= 0 && ({bar:1,kPa:0.01,Pa:0.00001,hPa:0.001,MPa:10,psi:0.0689475729317831})[(items[name].state.trim().split(/\s+/)[1]
                || items[name].unit || props.tirePressureUnit || ''bar'')] !== undefined ? (Number.parseFloat(items[name].state)
                * ({bar:1,kPa:0.01,Pa:0.00001,hPa:0.001,MPa:10,psi:0.0689475729317831})[(items[name].state.trim().split(/\s+/)[1]
                || items[name].unit || props.tirePressureUnit || ''bar'')]).toLocaleString(''de-DE'',
                {minimumFractionDigits:2,maximumFractionDigits:2}) + '' bar'' : ''—'''
              openingNames: '=(selection) => (selection && selection.split ? [selection] : selection
                || []).filter((name) => !!name).filter((name, index, names) => names.indexOf(name)
                === index)'
              openingState: '=(name) => [''NULL'', ''UNDEF'', ''''].indexOf((name && items[name]
                && items[name].state ? items[name].state.trim().toUpperCase() : ''UNDEF''))
                >= 0 ? ''unknown'' : ((props.windowItems && props.windowItems.split ? [props.windowItems]
                : props.windowItems || []).indexOf(name) >= 0 ? (props.windowOpenStates || [''OPEN'',
                ''OPENED'', ''INTERMEDIATE'', ''TILTED'', ''PARTIALLY_OPEN'']) : (props.doorOpenStates
                || [''TRUE'', ''ON''])).map((state) => state.trim().toUpperCase()).indexOf((name
                && items[name] && items[name].state ? items[name].state.trim().toUpperCase()
                : ''UNDEF'')) >= 0 ? ''open'' : ((props.windowItems && props.windowItems.split
                ? [props.windowItems] : props.windowItems || []).indexOf(name) >= 0 ? (props.windowClosedStates
                || [''CLOSE'', ''CLOSED'']) : (props.doorClosedStates || [''FALSE'', ''OFF''])).map((state)
                => state.trim().toUpperCase()).indexOf((name && items[name] && items[name].state
                ? items[name].state.trim().toUpperCase() : ''UNDEF'')) >= 0 ? ''closed'' : ''unknown'''
              openingCount: =(states, state) => states.filter((value) => value === state).length
              openingSummary: '=(states) => states.filter((state) => state === ''open'').length
                > 0 ? states.filter((state) => state === ''open'').length + '' offen'' + (states.filter((state)
                => state === ''unknown'').length > 0 ? '' · '' + states.filter((state) => state
                === ''unknown'').length + '' unbekannt'' : '''') : states.filter((state) =>
                state === ''unknown'').length > 0 ? states.filter((state) => state === ''unknown'').length
                + '' unbekannt'' : states.length > 0 ? ''alle überwachten zu'' : ''nicht konfiguriert'''
              openingText: '=(state) => state === ''open'' ? ''Offen'' : state === ''closed''
                ? ''Geschlossen'' : ''Unbekannt'''
              energy: '=(name) => name && items[name] && Number.isFinite(Number.parseFloat(items[name].state))
                && Number.parseFloat(items[name].state) >= 0 && [''kWh'', ''Wh''].indexOf(items[name].state.trim().split(/\s+/)[1]
                || items[name].unit || ''kWh'') >= 0 ? Number.parseFloat(items[name].state)
                * ((items[name].state.trim().split(/\s+/)[1] || items[name].unit || ''kWh'')
                === ''Wh'' ? 0.001 : 1) : -1'
              liters: '=(name) => name && items[name] && Number.isFinite(Number.parseFloat(items[name].state))
                && Number.parseFloat(items[name].state) >= 0 && [''l'', ''L''].indexOf(items[name].state.trim().split(/\s+/)[1]
                || items[name].unit || ''l'') >= 0 ? Number.parseFloat(items[name].state) :
                -1'
              deficit: '=(percent, capacity, remaining, useRemaining) => Number.isFinite(Number(capacity))
                && Number(capacity) > 0 ? (useRemaining ? (remaining >= 0 && remaining <= Number(capacity)
                ? Number(capacity) - remaining : -1) : (percent >= 0 && percent <= 100 ? Number(capacity)
                * (100 - percent) / 100 : -1)) : -1'
              amount: '=(value, unit) => Number.isFinite(value) && value >= 0 ? value.toLocaleString(''de-DE'',
                {minimumFractionDigits:1, maximumFractionDigits:1}) + unit : ''—'''
              cableState: '=(name) => [''NULL'',''UNDEF'',''''].indexOf((name && items[name]
                && items[name].state ? items[name].state.trim().toUpperCase() : ''UNDEF''))
                >= 0 ? ''unknown'' : (props.chargingCableConnectedStates || [''ON'',''TRUE'',''CONNECTED'',''PLUGGED_IN'']).map((value)
                => value.trim().toUpperCase()).indexOf((name && items[name] && items[name].state
                ? items[name].state.trim().toUpperCase() : ''UNDEF'')) >= 0 ? ''connected''
                : (props.chargingCableDisconnectedStates || [''OFF'',''FALSE'',''DISCONNECTED'',''UNPLUGGED'']).map((value)
                => value.trim().toUpperCase()).indexOf((name && items[name] && items[name].state
                ? items[name].state.trim().toUpperCase() : ''UNDEF'')) >= 0 ? ''disconnected''
                : ''unknown'''
              storedEnergy: '=(percent, capacity) => Number.isFinite(Number(capacity)) && Number(capacity)
                > 0 && Number.isFinite(percent) && percent >= 0 && percent <= 100 ? Number(capacity)
                * percent / 100 : -1'
          slots:
            default:
              - component: div
                config:
                  style:
                    width: 100%
                    min-width: '0'
                    white-space: normal
                    padding: 12px 0
                slots:
                  default:
                    - component: div
                      config:
                        style:
                          display: flex
                          align-items: flex-start
                          justify-content: space-between
                          flex-wrap: wrap
                          gap: 8px
                          margin-bottom: 14px
                      slots:
                        default:
                          - component: div
                            config: {}
                            slots:
                              default:
                                - component: Label
                                  config:
                                    text: =props.vehicleName || 'Mein BMW'
                                    style:
                                      white-space: normal
                                      overflow-wrap: anywhere
                                      font-size: 17px
                                      font-weight: '600'
                                - component: Label
                                  config:
                                    text: '=(props.driveType === ''DIESEL'' ? ''Diesel'' : props.driveType
                                      === ''ICE'' ? ''Benzin'' : props.driveType === ''PHEV''
                                      ? ''Plug-in-Hybrid'' : ''Elektro'') + (props.mileageItem
                                      ? '' · '' + fn.value(props.mileageItem, '' km'', 0) :
                                      '''')'
                                    style:
                                      white-space: normal
                                      overflow-wrap: anywhere
                                      font-size: 13px
                                      color: var(--f7-list-item-footer-text-color, var(--f7-text-color))
                          - component: div
                            config:
                              style:
                                text-align: right
                                max-width: 100%
                                min-width: '0'
                            slots:
                              default:
                                - component: Label
                                  config:
                                    text: '=[].concat(props.lockedState || ''ON'').indexOf(fn.state(props.lockItem)) >= 0 ? ''Zuletzt: verriegelt'' : [].concat(props.unlockedState || ''OFF'').indexOf(fn.state(props.lockItem)) >= 0 ? ''Zuletzt: offen''
                                      : ''Verriegelung unbekannt'''
                                    style:
                                      white-space: normal
                                      overflow-wrap: anywhere
                                      font-size: 13px
                                      color: '=[].concat(props.lockedState || ''ON'').indexOf(fn.state(props.lockItem)) >= 0 ? ''var(--f7-color-green)'' : [].concat(props.unlockedState || ''OFF'').indexOf(fn.state(props.lockItem)) >= 0 ? ''var(--f7-color-orange)''
                                        : ''var(--f7-list-item-footer-text-color)'''
                                      max-width: 100%
                                    visible: =!!props.lockItem
                                - component: Label
                                  config:
                                    text: '=fn.state(props.lastUpdateItem) !== ''UNDEF'' &&
                                      fn.state(props.lastUpdateItem) !== ''NULL'' && dayjs(fn.state(props.lastUpdateItem)).isValid()
                                      ? ''*'' + dayjs(fn.state(props.lastUpdateItem)).format(''DD.MM.YYYY
                                      HH:mm'') : ''Letzter Empfang unbekannt'''
                                    style:
                                      white-space: normal
                                      overflow-wrap: anywhere
                                      font-size: 13px
                                      color: var(--f7-list-item-footer-text-color, var(--f7-text-color))
                                    visible: =!!props.lastUpdateItem
                    - component: div
                      config:
                        style:
                          display: flex
                          align-items: center
                          justify-content: space-between
                          flex-wrap: wrap
                          gap: 8px
                          margin-bottom: 10px
                        visible: =!!props.rangeItem
                      slots:
                        default:
                          - component: Label
                            config:
                              text: =fn.value(props.rangeItem, ' km', 0)
                              style:
                                white-space: normal
                                overflow-wrap: anywhere
                                font-size: 23px
                                font-weight: '600'
                          - component: Label
                            config:
                              text: '=props.driveType === ''PHEV'' ? ''Gesamtreichweite'' :
                                ''Reichweite'''
                              style:
                                white-space: normal
                                overflow-wrap: anywhere
                                font-size: 13px
                                color: var(--f7-list-item-footer-text-color, var(--f7-text-color))
                    - component: div
                      config:
                        visible: =!!props.batteryItem && (props.driveType !== 'ICE' && props.driveType
                          !== 'DIESEL')
                        style:
                          margin-bottom: 12px
                      slots:
                        default:
                          - component: div
                            config:
                              style:
                                display: flex
                                align-items: center
                                justify-content: space-between
                                flex-wrap: wrap
                                gap: 8px
                            slots:
                              default:
                                - component: div
                                  config:
                                    style:
                                      display: inline-flex
                                      align-items: center
                                      flex-wrap: wrap
                                      gap: 6px
                                      min-width: '0'
                                  slots:
                                    default:
                                      - component: span
                                        config:
                                          role: img
                                          aria-label: Akku
                                          title: Akku
                                          style:
                                            display: inline-flex
                                            align-items: center
                                            flex-shrink: '0'
                                        slots:
                                          default:
                                            - component: oh-icon
                                              config:
                                                icon: material:battery_full
                                                width: '22'
                                                height: '22'
                                                style:
                                                  color: var(--f7-text-color)
                                      - component: Label
                                        config:
                                          text: '=(props.batteryMissingEnergyItem || props.batteryCapacityItem
                                            || Number(props.batteryCapacityKwh) > 0 ? fn.amount(props.batteryMissingEnergyItem
                                            ? fn.energy(props.batteryMissingEnergyItem) : fn.deficit(fn.number(props.batteryItem),
                                            props.batteryCapacityItem ? fn.energy(props.batteryCapacityItem)
                                            : props.batteryCapacityKwh, -1, false), '' kWh'')
                                            + '' nachladen'' : '''')'
                                          style:
                                            white-space: normal
                                            overflow-wrap: anywhere
                                            font-size: 14px
                                          visible: =!!(props.batteryMissingEnergyItem || props.batteryCapacityItem
                                            || Number(props.batteryCapacityKwh) > 0)
                                - component: Label
                                  config:
                                    text: '=((props.batteryEnergyItem || props.batteryCapacityItem
                                      || Number(props.batteryCapacityKwh) > 0) ? fn.amount(props.batteryEnergyItem
                                      ? fn.energy(props.batteryEnergyItem) : fn.storedEnergy(fn.number(props.batteryItem),
                                      props.batteryCapacityItem ? fn.energy(props.batteryCapacityItem)
                                      : props.batteryCapacityKwh), '' kWh'') + '' · '' : '''')
                                      + fn.value(props.batteryItem, '' %'', 0)'
