          label: Fahrzeug
        - name: energy
          label: Energie und Kilometer
        - name: status
          label: Status und Empfangszeit
        - name: openings
          label: Fenster, Türen und Kofferraum
        - name: tires
          label: Reifen
      parameters:
        - name: vehicleName
          label: Fahrzeugname
          type: TEXT
          default: Mein BMW
          groupName: vehicle
        - name: vehicleGroup
          label: Vehicle-Equipment-Gruppe
          type: TEXT
          context: item
          groupName: vehicle
          description: Zur Zuordnung dokumentiert; Messwerte werden ausdrücklich über die folgenden
            Item-Parameter gewählt.
        - name: driveType
          label: Antrieb
          type: TEXT
          default: EV
          groupName: vehicle
          options:
            - label: Elektro
              value: EV
            - label: Diesel
              value: DIESEL
            - label: Benzin
              value: ICE
            - label: Plug-in-Hybrid
              value: PHEV
        - name: batteryItem
          label: Akku (%)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Dimensionless, Wert von 0 bis 100 in Prozent.
        - name: fuelItem
          label: Tank (%)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Dimensionless, Wert von 0 bis 100 in Prozent.
        - name: batteryEnergyItem
          label: Aktueller Akkuinhalt als Item (optional, kWh / Wh)
          type: TEXT
          context: item
          groupName: energy
          description: Nur ein Item für tatsächlich aktuell gespeicherte Energie, nicht die
            Gesamtkapazität. Optionaler direkter Messwert; sonst wird der Inhalt aus nutzbarer
            Kapazität und Ladeprozent berechnet.
        - name: batteryMissingEnergyItem
          label: Fehlende Akkuenergie bis 100 % (kWh)
          type: TEXT
          context: item
          groupName: energy
          description: 'Optional: BMW smeEnergyDeltaFullyCharged; kWh oder Wh, einheitenlos
            als kWh. Vorrang vor Berechnung aus Akkukapazität.'
        - name: batteryCapacityItem
          label: Nutzbare Akkukapazität als Item (kWh / Wh)
          type: TEXT
          context: item
          groupName: energy
          description: Gesamtkapazität des nutzbaren Akkus. Berechnet aktuellen Akkuinhalt und
            fehlende Energie aus Ladeprozent. Vorrang vor fester Kapazität. Das Delta-Item ersetzt
            nur die Berechnung der fehlenden Energie.
        - name: batteryCapacityKwh
          label: Nutzbare Akkukapazität (kWh)
          type: DECIMAL
          min: 0
          groupName: energy
          description: Feste nutzbare Gesamtkapazität für die Berechnung des aktuellen Akkuinhalts
            und der fehlenden Energie aus Ladeprozent; alternativ Kapazitäts-Item verwenden.
            Ohne Ladeverluste.
        - name: fuelRemainingItem
          label: Restkraftstoff (Liter)
          type: TEXT
          context: item
          groupName: energy
          description: 'Optional: BMW remainingFuel; Zustand in l/L, einheitenlos als Liter.
            Zusammen mit Tankkapazität zur Berechnung der fehlenden Liter.'
        - name: tankCapacityLiters
          label: Tankkapazität (Liter)
          type: DECIMAL
          min: 0
          groupName: energy
          description: 'Für fehlende Liter: Tankkapazität minus Restkraftstoff, andernfalls
            Schätzung aus Tank-Prozentstand.'
        - name: rangeItem
          label: Gesamtreichweite (km)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Length, Zustand in km.
        - name: electricRangeItem
          label: Elektrische Reichweite (km)
          type: TEXT
          context: item
          groupName: energy
          description: Optional für Plug-in-Hybrid; Zustand in km.
        - name: mileageItem
          label: Kilometerstand (km)
          type: TEXT
          context: item
          groupName: energy
          description: Number oder Number:Length, Zustand in km.
        - name: chargingItem
          label: Ladestatus
          type: TEXT
          context: item
          groupName: status
          description: Switch oder String. Aktive und inaktive Zustände unten konfigurieren.
        - name: chargingCableItem
          label: Ladekabel angeschlossen
          type: TEXT
          context: item
          groupName: status
          description: 'Optional: Anschlussstatus des Ladekabels, unabhängig vom eigentlichen
            Ladestatus.'
        - name: chargingCableConnectedStates
          label: 'Ladekabel: angeschlossen'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Rohzustände als einzelne Einträge. Standard: ON, TRUE, CONNECTED, PLUGGED_IN.'
        - name: chargingCableDisconnectedStates
          label: 'Ladekabel: getrennt'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Rohzustände als einzelne Einträge. Standard: OFF, FALSE, DISCONNECTED,
            UNPLUGGED.'
        - name: chargingPowerItem
          label: Ladeleistung Wallbox (W / kW)
          type: TEXT
          context: item
          groupName: energy
          description: Leistungs-Item des Wallbox-Strommessers. W oder kW werden als Watt angezeigt;
            ohne Einheit wird W angenommen. Keine automatische Ableitung des Fahrzeug-Ladestatus.
        - name: chargingPowerStandbyWatts
          label: Standby-Grenze Wallbox (W)
          type: INTEGER
          default: 10
          min: 0
          groupName: energy
          description: 'Messwerte bis einschließlich dieser Grenze werden als 0 W angezeigt.
            Größere Messwerte bleiben unverändert. Standard: 10 W.'
        - name: chargeTargetItem
          label: Ladeziel (%)
          type: TEXT
          context: item
          groupName: energy
          description: Optional; Zustand in Prozent.
        - name: chargeRemainingItem
          label: Restladezeit (Minuten)
          type: TEXT
          context: item
          groupName: energy
          description: Optional; Number oder Number:Time, Zustand in min.
        - name: lockItem
          label: Verriegelungsstatus
          type: TEXT
          context: item
          groupName: status
          description: Switch oder String. Verriegelt/entriegelt unten konfigurieren.
        - name: windowItems
          label: Fenster (mehrere Items)
          type: TEXT
          context: item
          multiple: true
          groupName: openings
          description: Einzelne Fenster-Items auswählen. Keine Item-Gruppe erforderlich; unbekannte
            Werte bleiben sichtbar.
        - name: doorItems
          label: Türen und Kofferraum (mehrere Items)
          type: TEXT
          context: item
          multiple: true
          groupName: openings
          description: Einzelne Tür- und Kofferraum-Items auswählen. Öffnungszustände verwenden,
            keinen Verriegelungsstatus.
        - name: windowOpenStates
          label: 'Fenster: offen / teilweise offen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für offene Fenster. Ohne eigene Liste: OPEN, OPENED, INTERMEDIATE,
            TILTED, PARTIALLY_OPEN. Mehrere Zustände als einzelne Einträge hinzufügen.'
        - name: windowClosedStates
          label: 'Fenster: geschlossen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für geschlossene Fenster. Ohne eigene Liste: CLOSE, CLOSED.'
        - name: doorOpenStates
          label: 'Türen und Kofferraum: offen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für offene Türen und Kofferraum. Ohne eigene Liste: TRUE,
            ON.'
        - name: doorClosedStates
          label: 'Türen und Kofferraum: geschlossen'
          type: TEXT
          multiple: true
          groupName: openings
          description: 'Rohzustände für geschlossene Türen und Kofferraum. Ohne eigene Liste:
            FALSE, OFF.'
        - name: openingsItem
          label: Öffnungsstatus (bisheriges Sammel-Item, optional)
          type: TEXT
          context: item
          groupName: openings
          description: 'Fallback, wenn keine Fenster-/Tür-Items ausgewählt sind. ON: offen,
            OFF: zu. Neue Einzel-Items haben Vorrang.'
        - name: tireWarningItem
          label: Reifenwarnung (aggregiert)
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: ON bedeutet Warnung, OFF bedeutet keine gemeldete Warnung.
            Ohne dieses Item wird kein Reifen-OK abgeleitet.'
        - name: tirePressureUnit
          label: Reifendruck-Einheit bei Werten ohne Einheit
          type: TEXT
          default: bar
          groupName: tires
          options:
            - label: bar
              value: bar
            - label: kPa
              value: kPa
            - label: Pa
              value: Pa
            - label: hPa
              value: hPa
            - label: MPa
              value: MPa
            - label: psi
              value: psi
          description: Nur wenn der Item-Rohzustand und items.unit keine Einheit liefern. Bei
            einheitenlosen BMW-Werten in kPa hier kPa auswählen. Number:Pressure bevorzugen.
        - name: tireFLItem
          label: Reifendruck vorne links
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: tireFRItem
          label: Reifendruck vorne rechts
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: tireRLItem
          label: Reifendruck hinten links
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: tireRRItem
          label: Reifendruck hinten rechts
          type: TEXT
          context: item
          groupName: tires
          description: 'Optional: Number:Pressure. Unterstützt bar, kPa, Pa, hPa, MPa und psi;
            Anzeige in bar mit zwei Dezimalstellen.'
        - name: lastUpdateItem
          label: Letzter Empfang (DateTime)
          type: TEXT
          context: item
          groupName: status
          description: 'Homie telemetry#last-update: Empfangszeit der Bridge, kein Messzeitpunkt
            jedes einzelnen Werts.'
        - name: lockedState
          label: 'Zustände: verriegelt'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung
            beachten. Ohne eigene Zuordnung: ON.'
        - name: unlockedState
          label: 'Zustände: entriegelt'
          type: TEXT
          multiple: true
          groupName: status
          description: 'Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung
            beachten. Ohne eigene Zuordnung: OFF.'
        - name: chargingState
          label: 'Zustände: lädt'
          type: TEXT
          multiple: true
          groupName: status
          description: Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung beachten.
        - name: notChargingState
          label: 'Zustände: lädt nicht'
          type: TEXT
          multiple: true
          groupName: status
          description: Mehrere exakte Rohzustände einzeln hinterlegen; Groß-/Kleinschreibung beachten.
    component: oh-list-card
    config:
      noShadow: true
      noBorder: true
      accordionList: true
      style:
        border-radius: 16px
        overflow: hidden
        margin: '0'
        width: 100%
    slots:
      default:
        - component: widget:bmw_vehicle_comfort_list
          config:
            vehicleName: =props.vehicleName
            vehicleGroup: =props.vehicleGroup
            driveType: =props.driveType
            batteryItem: =props.batteryItem
            fuelItem: =props.fuelItem
            rangeItem: =props.rangeItem
            electricRangeItem: =props.electricRangeItem
            mileageItem: =props.mileageItem
            chargingItem: =props.chargingItem
            chargeTargetItem: =props.chargeTargetItem
            chargeRemainingItem: =props.chargeRemainingItem
            lockItem: =props.lockItem
            openingsItem: =props.openingsItem
            tireWarningItem: =props.tireWarningItem
            tireFLItem: =props.tireFLItem
            tireFRItem: =props.tireFRItem
            tireRLItem: =props.tireRLItem
            tireRRItem: =props.tireRRItem
            lastUpdateItem: =props.lastUpdateItem
            lockedState: =props.lockedState
            unlockedState: =props.unlockedState
            chargingState: =props.chargingState
            notChargingState: =props.notChargingState
            chargingPowerItem: =props.chargingPowerItem
            chargingPowerStandbyWatts: =props.chargingPowerStandbyWatts
            tirePressureUnit: =props.tirePressureUnit
            windowItems: =props.windowItems
            doorItems: =props.doorItems
            windowOpenStates: =props.windowOpenStates
            windowClosedStates: =props.windowClosedStates
            doorOpenStates: =props.doorOpenStates
            doorClosedStates: =props.doorClosedStates
            batteryMissingEnergyItem: =props.batteryMissingEnergyItem
            batteryCapacityKwh: =props.batteryCapacityKwh
            fuelRemainingItem: =props.fuelRemainingItem
            tankCapacityLiters: =props.tankCapacityLiters
            batteryEnergyItem: =props.batteryEnergyItem
            chargingCableItem: =props.chargingCableItem
            chargingCableConnectedStates: =props.chargingCableConnectedStates
            chargingCableDisconnectedStates: =props.chargingCableDisconnectedStates
            batteryCapacityItem: =props.batteryCapacityItem
