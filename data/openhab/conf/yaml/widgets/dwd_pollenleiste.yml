---
version: 1
widgets:
  dwd_pollenleiste:
    tags:
    - Wetter
    - DWD
    - Pollen
    props:
      parameterGroups:
      - name: alder
        label: Erle
      - name: hazel
        label: Hasel
      - name: ash
        label: Esche
      - name: birch
        label: Birke
      - name: grasses
        label: Gräser
      - name: rye
        label: Roggen
      - name: mugwort
        label: Beifuß
      - name: ambrosia
        label: Ambrosia
      parameters:
      - name: title
        label: Titel
        type: TEXT
        default: DWD Pollenflug
      - name: location
        label: Region / Untertitel
        type: TEXT
        description: Optional, z. B. Zuhause oder die Bezeichnung deiner DWD-Region.
      - name: updatedItem
        label: DWD-Datenstand
        type: TEXT
        context: item
        description: Optionales DateTime-Item am Bridge-Channel updates#last_update.
          Kein eigener Abrufzeitpunkt.
      - name: showAllToday
        label: Auch unbelastete Arten direkt anzeigen
        type: BOOLEAN
        default: false
      - name: testMode
        label: Testmodus
        type: TEXT
        default: live
        options:
        - value: live
          label: Live – verknüpfte Items
        - value: none
          label: Test – keine Belastung
        - value: mixed
          label: Test – unterschiedliche Belastung
        - value: future
          label: Test – erst morgen / übermorgen belastet
        - value: missing
          label: Test – fehlende Daten
        description: Beispieldaten sind gekennzeichnet und verändern keine Items.
      - name: alderToday
        label: Heute
        type: TEXT
        context: item
        groupName: alder
        description: String-Item für Erle. Rohwert (z. B. 1-2) oder Text mit Index
          in Klammern (z. B. gering bis mittel (1-2)).
      - name: alderTomorrow
        label: Morgen
        type: TEXT
        context: item
        groupName: alder
        description: String-Item für Erle. Rohwert (z. B. 1-2) oder Text mit Index
          in Klammern (z. B. gering bis mittel (1-2)). Optional.
      - name: alderDayAfter
        label: Übermorgen
        type: TEXT
        context: item
        groupName: alder
        description: String-Item für Erle. Rohwert (z. B. 1-2) oder Text mit Index
          in Klammern (z. B. gering bis mittel (1-2)). Optional.
      - name: hazelToday
