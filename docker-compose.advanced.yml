# Optional extension; use together with docker-compose.yml.
# See docs/bridges.advanced.md and .env.advanced.example.
services:
  sma-mqtt-bridge:
    profiles: [sma]
    image: ghcr.io/alaub81/sma-mqtt-bridge:${SMAB_BRIDGE_VERSION:-latest}
    user: "${SMAB_UID:-10001}:${SMAB_GID:-10001}"
    depends_on:
      mosquitto:
        condition: service_healthy
        required: false
    # Application settings belong only in smab.env, not in the stack's .env.
    # Keep optional so an unused SMA profile does not require this private file.
    env_file:
      - path: ${SMAB_ENV_FILE:-./smab.env}
        required: false
    volumes:
      - "./data/sma-mqtt-bridge:/data/sma-mqtt-bridge/config:ro"
      - "data_smab_state:/data/sma-mqtt-bridge/state"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      # Retain the bridge image's heartbeat-based healthcheck command.
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # Shared broker DNS and outbound device access; Home Manager uses Modbus TCP.
    networks:
      - app-nw
      - backend-nw

  bmw-mqtt-bridge:
    profiles: [bmw]
    image: ghcr.io/alaub81/bmw-mqtt-bridge:${BMB_VERSION:-latest}
    depends_on:
      mosquitto:
        condition: service_healthy
        required: false
    environment:
      # Compose checks required IDs before filtering profiles. Keep the template
      # placeholders for an unused BMW profile; replace them before authentication.
      BMB_LOG_LEVEL: "${BMB_LOG_LEVEL:-info}"
      BMB_BMW_CLIENT_ID: "${BMB_BMW_CLIENT_ID:?Set BMB_BMW_CLIENT_ID in .env}"
      BMB_BMW_GCID: "${BMB_BMW_GCID:?Set BMB_BMW_GCID in .env}"
      BMB_MQTT_LOCAL_HOST: "${BMB_MQTT_LOCAL_HOST:-host.docker.internal}"
      BMB_MQTT_LOCAL_PORT: "${BMB_MQTT_LOCAL_PORT:-8883}"
      BMB_MQTT_LOCAL_USER: "${BMB_MQTT_LOCAL_USER:-}"
      BMB_MQTT_LOCAL_PASSWORD: "${BMB_MQTT_LOCAL_PASSWORD:-}"
      BMB_MQTT_LOCAL_PREFIX: "${BMB_MQTT_LOCAL_PREFIX:-bmw/}"
      BMB_MQTT_LOCAL_TLS: "${BMB_MQTT_LOCAL_TLS:-true}"
      BMB_MQTT_LOCAL_TLS_VERIFY: "${BMB_MQTT_LOCAL_TLS_VERIFY:-false}"
      BMB_MQTT_HOMIE: "${BMB_MQTT_HOMIE:-0}"
      BMB_MQTT_RAW_TOPICS: "${BMB_MQTT_RAW_TOPICS:-1}"
      BMB_MQTT_SPLIT_TOPICS: "${BMB_MQTT_SPLIT_TOPICS:-0}"
      BMB_HEALTH_MQTT_DISCONNECT_TIMEOUT: "${BMB_HEALTH_MQTT_DISCONNECT_TIMEOUT:-120}"
      BMB_BMW_HOST: "${BMB_BMW_HOST:-customer.streaming-cardata.bmwgroup.com}"
      BMB_BMW_PORT: "${BMB_BMW_PORT:-9000}"
      BMB_BMW_STATUS_STABLE_DELAY: "${BMB_BMW_STATUS_STABLE_DELAY:-5}"
      BMB_MQTT_LOCAL_CLIENT_ID: "${BMB_MQTT_LOCAL_CLIENT_ID:-}"
      BMB_MQTT_RETAIN: "${BMB_MQTT_RETAIN:-0}"
    volumes:
      - "data_bmb_token:/app/token"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    # Do not enable init here: the upstream probe checks the bridge at PID 1.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test /proc/1/exe -ef /app/bmw_mqtt_bridge &&
          read -r heartbeat_time heartbeat_pid local_offline bmw_offline < "$${BMB_BMW_HEARTBEAT_FILE:-/tmp/bmw-mqtt-bridge-heartbeat}" &&
          test "$$heartbeat_pid" = 1 &&
          now=$$(date +%s) &&
          age=$$((now - heartbeat_time)) &&
          test "$$age" -ge 0 && test "$$age" -le 90 &&
          test "$$BMB_HEALTH_MQTT_DISCONNECT_TIMEOUT" -gt 0 &&
          test "$$local_offline" -ge 0 && test "$$bmw_offline" -ge 0 &&
          test "$$local_offline" -lt "$$BMB_HEALTH_MQTT_DISCONNECT_TIMEOUT" &&
          test "$$bmw_offline" -lt "$$BMB_HEALTH_MQTT_DISCONNECT_TIMEOUT"
      interval: 120s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-nw
      - backend-nw

volumes:
  data_smab_state:
  data_bmb_token:
